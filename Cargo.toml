[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"
indexmap = { version = "2", features = ["serde"] }
# Dev-only deps authorised by ADR-0006. Consumed as dev-dependencies by
# crpg-core (see crates/crpg-core/Cargo.toml); the property tests that use
# them land with T006a.
proptest = "1"
serde_json = "1"
